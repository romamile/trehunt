<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/trehunt/assets/css/main.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>

<div class="container">

    <!-- Home button -->
    <a href="/trehunt/" id="home-button" aria-label="Home">
        <i class="fa-solid fa-house"></i>
    </a>
    
    <!-- Coin counter -->
    <div id="coin-counter">Coins: <span id="coins">0</span></div>
    
    <!-- Title -->
    <h1 class="title">{{ page.title }}</h1>

    <!-- Picture -->
    {% if page.picture %}
    <div class="image-block">
        <img src="{{ page.picture }}" alt="{{ page.title }}">
    </div>
    {% endif %}

    <!-- Markdown content -->
    <div class="content">
        {{ content }}
    </div>

    <!-- Clues -->
    {% if page.clues %}
    <div id="clues">
        {% for clue in page.clues %}
         <div class="clue hidden">{{ clue }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <button id="reveal-button" class="reveal-btn">Reveal next clue, for a price!</button>

    <!-- QRCode camera system -->
    <div id="scan-container">
        <p>Scan the correct QR code to reveal the next page.</p>
        <div id="activate" class="box">Click to activate camera</div>
    
        <div id="camera-wrapper" class="hidden square">
          <div id="my-camera"></div>
        </div>
    
        <div id="result" class="box hidden">Good</div>
    </div>

    
</div>

<script>
    // Pass Jekyll/Liquid variables to JavaScript
    const PAGE_DATA = {
        id_story: {{ page.id_story }},
        id_step: {{ page.id_step }},
        hash: "{{ page.hash }}"
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="/trehunt/assets/js/html5-qrcode.min.js"></script>
<script src="/trehunt/assets/js/main.js"></script>
<script src="/trehunt/assets/js/QR-code.js"></script>
</body>
</html>
