<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/trehunt/assets/css/main.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>

<div class="container">

    <!-- Home button -->
    <a href="/trehunt/" id="home-button" aria-label="Home">
        <i class="fa-solid fa-house"></i>
    </a>
    
    <!-- Coin counter -->
    <div id="coin-counter">Coins: <span id="coins">0</span></div>
    
    <!-- Title -->
    <h1 class="title">{{ page.title }}</h1>
    
    {% assign steps = site.pages
       | where: "id_story", page.id_story
       | where_exp: "p", "p.id_step != nil"
       | sort: "id_step" %}
    
    {% for step in steps %}
      <section class="step">
        <!-- <h2>{{ step.title }}</h2>  -->
        <!-- Picture -->
        <div class="image-block-whole-story">
            <img src="/trehunt/assets/img/str{{ step.id_story }}_{{ step.id_step }}.jpg" alt="{{ step.title }}">    
        </div>
        <div class="content">
          {{ step.content }}
        </div>
      </section>
    {% endfor %}
    
</div>
{% include footer.html %}
</body>
</html>
